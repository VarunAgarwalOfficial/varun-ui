# Publishes shell/ to GitHub Pages at /varun-ui/shell/, the one copy every
# demo page links. The root page (pages/index.html) points to it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [shell/**, pages/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r shell _site/shell && cp pages/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
